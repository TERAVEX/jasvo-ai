name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'chat-ui/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'supabase/functions/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'chat-ui/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'supabase/functions/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build web assets and package Supabase SDK
        run: |
          npm run web:build
          test -s chat-ui/supabase-sdk.js
          node --check chat-ui/supabase-sdk.js
          node --check chat-ui/app.js
          node --check chat-ui/supabase-config.js

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Verify bundled SDK is in Android assets
        run: test -s android/app/src/main/assets/public/supabase-sdk.js

      - name: Configure Maven Central mirror for transient rate limits
        run: |
          cat > "$RUNNER_TEMP/maven-mirror.init.gradle" <<'EOF'
          allprojects {
            repositories {
              maven { url 'https://maven-central.storage-download.googleapis.com/maven2' }
            }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000
        run: |
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if ./gradlew --no-daemon --max-workers=2 --init-script "$RUNNER_TEMP/maven-mirror.init.gradle" assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "Gradle build failed after three attempts."
          exit 1

      - name: Prepare public APK filename
        if: github.event_name == 'push'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/JASVO-AI.apk

      - name: Publish latest Android APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: JASVO AI Android — Latest
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/JASVO-AI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jasvo-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
