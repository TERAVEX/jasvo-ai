name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'chat-ui/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'chat-ui/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Package Supabase SDK for local WebView loading
        run: |
          SDK_PATH="node_modules/@supabase/supabase-js/dist/umd/supabase.js"
          test -s "$SDK_PATH"
          cp "$SDK_PATH" chat-ui/supabase-sdk.js
          test -s chat-ui/supabase-sdk.js
          node --check chat-ui/supabase-sdk.js
          node --check chat-ui/app.js
          node --check chat-ui/supabase-config.js

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Verify bundled SDK is in Android assets
        run: test -s android/app/src/main/assets/public/supabase-sdk.js

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jasvo-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
