services:
  - type: web
    name: jasvo-ai
    runtime: static
    buildCommand: npm install && npm run web:build
    staticPublishPath: ./chat-ui
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
